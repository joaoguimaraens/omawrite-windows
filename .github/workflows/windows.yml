name: Windows

on:
  push:
    branches:
      - master
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Check out the source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache Qt
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .tools/Qt
          key: qt-6.8.3-msvc2022-x64

      - name: Build, test, and package
        shell: powershell
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "dev-$env:GITHUB_SHA".Substring(0, 12)
          }
          .\windows\build.ps1 -Version $version

      - name: Verify installation and removal
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $setups = @(Get-ChildItem -LiteralPath dist -Filter *-Setup.exe -File)
          if ($setups.Count -ne 1) {
            throw "Expected exactly one Setup EXE, found $($setups.Count)."
          }
          $installDirectory = Join-Path $env:LOCALAPPDATA "Programs\Omawrite"
          $executable = Join-Path $installDirectory "omawrite.exe"
          $uninstaller = Join-Path $installDirectory "unins000.exe"
          $progId = "Registry::HKEY_CURRENT_USER\Software\Classes\Omawrite.Markdown"
          $registeredApps = "Registry::HKEY_CURRENT_USER\Software\RegisteredApplications"
          if ((Test-Path -LiteralPath $installDirectory) -or (Test-Path -LiteralPath $progId)) {
            throw "Omawrite is already installed on this runner."
          }
          try {
            $setup = Start-Process -FilePath $setups[0].FullName `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
              -WindowStyle Hidden -Wait -PassThru
            if ($setup.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $executable)) {
              throw "Setup failed with code $($setup.ExitCode)."
            }
            $versionMatch = Select-String -LiteralPath omawrite.pro `
              -Pattern '^win32: VERSION = (\S+)'
            $expectedVersion = $versionMatch.Matches[0].Groups[1].Value
            $uninstallKey = Get-Item -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{AE6883F4-1FC1-44FE-BE70-362A97A57B86}_is1'
            if ($uninstallKey.GetValue("DisplayName") -ne "Omawrite") {
              throw "The installed app display name must be Omawrite."
            }
            if ($uninstallKey.GetValue("Publisher") -ne "Omacom") {
              throw "The installed app publisher must be Omacom."
            }
            $packageVersion = $setups[0].BaseName -replace '^Omawrite-Windows-(.+)-x64-Setup$', '$1'
            if ($uninstallKey.GetValue("DisplayVersion") -ne $packageVersion) {
              throw "The installed app version does not match the package version."
            }
            $version = (& $executable --version | Out-String).Trim()
            if ($LASTEXITCODE -ne 0 -or $version -ne "omawrite $expectedVersion") {
              throw "Unexpected installed version: $version"
            }
            $openCommand = (Get-Item -LiteralPath "$progId\shell\open\command").GetValue("")
            if ($openCommand -ne ('"{0}" "%1"' -f $executable)) {
              throw "The Markdown open command does not target the installed app."
            }
            $registration = (Get-Item -LiteralPath $registeredApps).GetValue("Omawrite")
            if ($registration -ne "Software\OmawriteWindows\Capabilities") {
              throw "The Windows application registration is missing."
            }
          } finally {
            if (Test-Path -LiteralPath $uninstaller) {
              $removal = Start-Process -FilePath $uninstaller `
                -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
                -WindowStyle Hidden -Wait -PassThru
              if ($removal.ExitCode -ne 0) {
                throw "Uninstall failed with code $($removal.ExitCode)."
              }
            }
          }
          if ((Test-Path -LiteralPath $executable) -or (Test-Path -LiteralPath $progId)) {
            throw "Uninstall left the executable or Markdown registration installed."
          }
          if ((Get-Item -LiteralPath $registeredApps).GetValue("Omawrite")) {
            throw "Uninstall left the application registration installed."
          }
          Write-Host "Setup installed, registered, ran, and uninstalled Omawrite."

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: omawrite-windows-x64
          path: |
            dist/*.zip
            dist/*-Setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download the Windows package
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: omawrite-windows-x64
          path: release

      - name: Create checksum
        shell: powershell
        run: |
          $zips = @(Get-ChildItem -LiteralPath release -Filter *.zip -File -Recurse)
          if ($zips.Count -ne 1) {
            throw "Expected exactly one release ZIP, found $($zips.Count)."
          }
          $zip = $zips[0]
          $setups = @(Get-ChildItem -LiteralPath release -Filter *-Setup.exe -File -Recurse)
          if ($setups.Count -ne 1) {
            throw "Expected exactly one Setup EXE, found $($setups.Count)."
          }
          $setup = $setups[0]
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($zip.FullName + ".sha256") `
            -Value "$hash  $($zip.Name)" -Encoding Ascii
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath ($setup.FullName + ".sha256") `
            -Value "$hash  $($setup.Name)" -Encoding Ascii

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $zips = @(Get-ChildItem -LiteralPath release -Filter *.zip -File -Recurse)
          if ($zips.Count -ne 1) {
            throw "Expected exactly one release ZIP, found $($zips.Count)."
          }
          $zip = $zips[0]
          $setups = @(Get-ChildItem -LiteralPath release -Filter *-Setup.exe -File -Recurse)
          if ($setups.Count -ne 1) {
            throw "Expected exactly one Setup EXE, found $($setups.Count)."
          }
          $setup = $setups[0]
          $releaseOptions = @("--generate-notes", "--verify-tag")
          if ($env:GITHUB_REF_NAME -match '-') {
            $releaseOptions += @("--prerelease", "--latest=false")
          }
          gh release create $env:GITHUB_REF_NAME `
            $zip.FullName ($zip.FullName + ".sha256") `
            $setup.FullName ($setup.FullName + ".sha256") `
            --repo $env:GITHUB_REPOSITORY `
            --title "Omawrite $env:GITHUB_REF_NAME" `
            @releaseOptions
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publication failed with code $LASTEXITCODE."
          }
